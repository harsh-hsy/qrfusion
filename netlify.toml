# Netlify deploys only this small redirect site. Cloudflare Pages continues to
# publish the application from the repository root.
[build]
  publish = "netlify-redirect"

# Keep old resume and shared links working after the move to Cloudflare Pages.
[[redirects]]
  from = "/*"
  to = "https://qrfusion.pages.dev/:splat"
  status = 301
  force = true
